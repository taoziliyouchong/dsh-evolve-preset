url: https://github.com/taoziliyouchong/dsh-evolve-preset
name: taoziliyouchong/dsh-evolve-preset
category: tools
description:
  en: "A thinking mode that helps the model understand your requests more accurately, achieve noticeably better results at the same cost — even in a single sentence — and build a long-term profile of your preferences; the mode text and companion plugins work together, scoped to Evolution mode."
  zh: 让模型更准确地理解你的需求、能够用相同的花费实现明显更好的效果（即使只有一句话）、长期积累你的偏好的思维模式；由模式正文与配套插件配合实现，内容只在进化模式生效。
